<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout paint under iOS notches/home bar;
         the safe-area padding in index.css keeps content clear of them.
         Zoom is deliberately NOT disabled (no maximum-scale/user-scalable). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Build ordered, versioned call-centre scripts with merge variables." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the web app manifest for these; they must be meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scripts" />
    <meta name="format-detection" content="telephone=no" />

    <title>Script Builder</title>

    <!-- Link preview. Static HTML: crawlers don't run JS. og:image must be an absolute PNG URL. -->
    <!-- The hardcoded host only resolves while script-builder.fitzdev.studio stays in the Render service's Custom Domains — Render routes on the Host header. -->
    <link rel="canonical" href="https://script-builder.fitzdev.studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitzDev Studio" />
    <meta property="og:url" content="https://script-builder.fitzdev.studio/" />
    <meta property="og:title" content="Script Builder" />
    <meta
      property="og:description"
      content="Build ordered, versioned call-centre scripts with merge variables and branching. React, TypeScript, FastAPI and SQLite."
    />
    <meta
      property="og:image"
      content="https://script-builder.fitzdev.studio/og.png"
    />
    <!-- Dimensions let a client reserve the full-size card box before the image lands. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Script Builder — a call-centre script authoring tool by FitzDev Studio"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Script Builder" />
    <meta
      name="twitter:description"
      content="Build ordered, versioned call-centre scripts with merge variables and branching."
    />
    <meta
      name="twitter:image"
      content="https://script-builder.fitzdev.studio/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
