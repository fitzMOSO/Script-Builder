<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout paint under iOS notches/home bar;
         the safe-area padding in index.css keeps content clear of them.
         Zoom is deliberately NOT disabled (no maximum-scale/user-scalable). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Build ordered, versioned call-centre scripts with merge variables." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the web app manifest for these; they must be meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scripts" />
    <meta name="format-detection" content="telephone=no" />

    <title>Script Builder</title>

    <!--
      Link preview (Open Graph + Twitter Card).

      Static HTML, not set from React: Facebook, LinkedIn, Slack, iMessage,
      WhatsApp and Discord all read the served HTML WITHOUT executing
      JavaScript, so tags applied at runtime are invisible to every one of them.

      Absolute URLs are required rather than preferred — `og:image` and
      `og:url` are specified absolute, and most crawlers drop a relative path
      silently instead of resolving it. That hardcodes the deployed host here.

      This app is served by its own FastAPI process out of the Docker image
      (there is no separate static host), and the domain only resolves while
      `script-builder.fitzdev.studio` stays registered under the Render
      service's Custom Domains — Render matches on the Host header, so
      unregistering it 404s these URLs even though DNS still resolves.

      The card is generated in the portfolio repo
      (`frontend/scripts/generate-og.mjs`) and copied here, so every FitzDev
      property shares one visual system rather than drifting per repo.
    -->
    <link rel="canonical" href="https://script-builder.fitzdev.studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitzDev Studio" />
    <meta property="og:url" content="https://script-builder.fitzdev.studio/" />
    <meta property="og:title" content="Script Builder" />
    <meta
      property="og:description"
      content="Build ordered, versioned call-centre scripts with merge variables and branching. React, TypeScript, FastAPI and SQLite."
    />
    <meta
      property="og:image"
      content="https://script-builder.fitzdev.studio/og.png"
    />
    <!-- Dimensions let a client reserve the right box before the image lands —
         the difference between a full-size card and one that collapses to a
         thumbnail on a slow first fetch. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Script Builder — a call-centre script authoring tool by FitzDev Studio"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Script Builder" />
    <meta
      name="twitter:description"
      content="Build ordered, versioned call-centre scripts with merge variables and branching."
    />
    <meta
      name="twitter:image"
      content="https://script-builder.fitzdev.studio/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
